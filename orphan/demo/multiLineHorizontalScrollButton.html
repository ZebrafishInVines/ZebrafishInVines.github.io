<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多行横向滚动按钮组</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .scroll-row {
            margin: 30px 0;
            position: relative;
        }
        
        .row-title {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1.4rem;
            font-weight: 600;
        }
        
        .row-title i {
            margin-right: 10px;
            font-size: 1.6rem;
        }
        
        .button-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 15px 10px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .button-container::-webkit-scrollbar {
            display: none;
        }
        
        .button {
            flex: 0 0 auto;
            padding: 18px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .button i {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        
        .button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        /* 行为1 - 蓝色系 */
        .row-1 .button {
            background: linear-gradient(145deg, #3498db, #2980b9);
            color: white;
        }
        
        /* 行为2 - 红色系 */
        .row-2 .button {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            color: white;
        }
        
        /* 行为3 - 绿色系 */
        .row-3 .button {
            background: linear-gradient(145deg, #2ecc71, #27ae60);
            color: white;
        }
        
        /* 行为4 - 紫色系 */
        .row-4 .button {
            background: linear-gradient(145deg, #9b59b6, #8e44ad);
            color: white;
        }
        
        /* 行为5 - 橙色系 */
        .row-5 .button {
            background: linear-gradient(145deg, #f39c12, #e67e22);
            color: white;
        }
        
        /* 行为6 - 深色系 */
        .row-6 .button {
            background: linear-gradient(145deg, #34495e, #2c3e50);
            color: white;
        }
        
        /* 行为7 - 粉色系 */
        .row-7 .button {
            background: linear-gradient(145deg, #fd79a8, #e84393);
            color: white;
        }
        
        .scroll-hint {
            position: absolute;
            right: 15px;
            top: 15px;
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
        }
        
        .scroll-hint i {
            margin-right: 5px;
        }
        
        .instructions {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-top: 40px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .instructions h2 {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        
        .instructions h2 i {
            margin-right: 10px;
        }
        
        .instructions p {
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .button {
                padding: 15px 20px;
                min-width: 130px;
                font-size: 14px;
            }
            
            .button i {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取所有按钮容器
            const buttonContainers = document.querySelectorAll('.button-container');
            
            // 为每个容器添加滚动事件监听
            buttonContainers.forEach(container => {
                // 监听鼠标滚轮事件
                container.addEventListener('wheel', function(e) {
                    // 阻止默认的垂直滚动
                    e.preventDefault();
                    
                    // 计算横向滚动量，调整滚动速度
                    const scrollAmount = e.deltaY * 0.8;
                    
                    // 应用横向滚动
                    this.scrollLeft += scrollAmount;
                });
                
                // 添加拖动功能
                let isDown = false;
                let startX;
                let scrollLeft;
                
                container.addEventListener('mousedown', (e) => {
                    isDown = true;
                    container.style.cursor = 'grabbing';
                    startX = e.pageX - container.offsetLeft;
                    scrollLeft = container.scrollLeft;
                });
                
                container.addEventListener('mouseleave', () => {
                    isDown = false;
                    container.style.cursor = 'grab';
                });
                
                container.addEventListener('mouseup', () => {
                    isDown = false;
                    container.style.cursor = 'grab';
                });
                
                container.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - container.offsetLeft;
                    const walk = (x - startX) * 2;
                    container.scrollLeft = scrollLeft - walk;
                });
            });
        });
    </script>
