<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站索引</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- 配置Tailwind自定义颜色和字体 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#222831',
                        secondary: '#393e46',
                        accent: '#00adb5',
                        dark: '#252a34',
                        light: '#eeeeee'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-hover {
                @apply transition-all duration-300 hover:shadow-lg hover:-translate-y-1;
            }
            .section-fade-in {
                animation: fadeIn 0.8s ease-in-out;
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
    <!-- 页面头部 -->
    <header class="bg-gradient-to-r from-primary to-accent text-white shadow-md">
        <div class="container mx-auto px-4 py-8 md:py-12">
            <h1 class="text-3xl md:text-4xl lg:text-5xl font-bold mb-2 text-center">网站索引</h1>
            <p class="text-center text-blue-100 max-w-2xl mx-auto">集中管理我的独立网页</p>
        </div>
    </header>

    <!-- 搜索栏 -->
    <div class="container mx-auto px-4 py-6">
        <div class="max-w-2xl mx-auto">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="搜索网站..." class="w-full py-3 px-4 pl-10 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            </div>
        </div>
    </div>

    <!-- 主要内容区 -->
    <main class="container mx-auto px-4 pb-16">
        <div id="websiteContainer" class="space-y-12">
            <!-- 内容将通过JavaScript动态生成 -->
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-dark text-gray-300 py-8">
        <div class="container mx-auto px-4 text-center">
            <p>网站索引 © 2025</p>
            <p class="text-sm mt-2 text-gray-400">ZebrafishInVines</p>
        </div>
    </footer>

    <script>
        // 网站数据 - 在这里添加/编辑网站和板块
        const websiteData = [
            {
                category: "被测页面",
                icon: "fa-file-code-o",
                color: "from-blue-500 to-blue-600",
                sites: [
                    {
                        name: "弹窗类型",
                        url: "http://zebrafishinvines.github.io/orphan/WebUIAlert.html",
                        description: "页面上有三个按钮，分别对应三种网页alert类型"
                    },
                    {
                        name: "按钮矩阵与滚动",
                        url: "http://zebrafishinvines.github.io/orphan/WebUIButtonGrid.html",
                        description: "10乘10的按钮矩阵，点击按钮弹出alert，关闭alert按钮变色"
                    },
                    {
                        name: "点击轨迹与计数",
                        url: "http://zebrafishinvines.github.io/orphan/WebUIClick.html",
                        description: "点击页面，被点击的位置会浮现一个点，还有点击的次数编号"
                    },
                    {
                        name: "鼠标轨迹与定位元素",
                        url: "http://zebrafishinvines.github.io/orphan/WebUIDrag.html",
                        description: "页面上有5乘5的可定位元素，按住鼠标滑动留下鼠标轨迹"
                    },
                    {
                        name: "元素拖拽",
                        url: "http://zebrafishinvines.github.io/orphan/WebUIDragElement.html",
                        description: "页面上有一个红色的圆形和一个虚线框"
                    },
                    {
                        name: "嵌套IFrame",
                        url: "http://zebrafishinvines.github.io/orphan/WebUIIFrame.html",
                        description: "页面上有多个IFrame和嵌套的IFrame"
                    },
                    {
                        name: "鼠标坐标与窗口尺寸",
                        url: "http://zebrafishinvines.github.io/orphan/WebUILocation.html",
                        description: "显示鼠标所在的坐标位置;显示浏览器窗口尺寸和浏览器外部尺寸"
                    }
                ]
            },
            {
                category: "测试工具",
                icon: "fa-wrench",
                color: "from-green-500 to-green-600",
                sites: [
                    {
                        name: "暂无",
                        url: "#",
                        description: "-"
                    }
                ]
            },
            {
                category: "网页demo",
                icon: "fa-desktop",
                color: "from-purple-500 to-purple-600",
                sites: [
                    {
                        name: "可编辑的动态表格",
                        url: "http://zebrafishinvines.github.io/orphan/demo/editable-table.html",
                        description: "一个可编辑的动态表格"
                    },
                    {
                        name: "横向滚动-单行",
                        url: "http://zebrafishinvines.github.io/orphan/demo/singleLineHorizontalScrollButton.html",
                        description: "一行按钮，鼠标放上去后滚动滑轮，可以左右移动"
                    },
                    {
                        name: "横向滚动-多行",
                        url: "http://zebrafishinvines.github.io/orphan/demo/multiLineHorizontalScrollButton.html",
                        description: "多行按钮，鼠标放上去后滚动滑轮，可以左右移动"
                    }
                ]
            }
        ];

        // 生成网站列表
        function renderWebsites(data) {
            const container = document.getElementById('websiteContainer');
            container.innerHTML = '';

            data.forEach((category, index) => {
                // 创建分类区块
                const categorySection = document.createElement('section');
                categorySection.className = 'section-fade-in';
                categorySection.style.animationDelay = `${index * 0.1}s`;
                
                // 分类标题
                const categoryHeader = document.createElement('div');
                categoryHeader.className = `flex items-center mb-6`;
                categoryHeader.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-gradient-to-r ${category.color} flex items-center justify-center mr-3">
                        <i class="fa ${category.icon} text-white text-xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800">${category.category}</h2>
                `;
                
                // 网站卡片容器
                const sitesGrid = document.createElement('div');
                sitesGrid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6';
                
                // 添加网站卡片
                category.sites.forEach(site => {
                    const card = document.createElement('a');
                    card.href = site.url;
                    card.target = "_blank";
                    card.className = 'bg-white rounded-xl shadow p-6 border border-gray-100 card-hover flex flex-col h-full';
                    card.innerHTML = `
                        <h3 class="text-lg font-semibold mb-2 text-gray-800">${site.name}</h3>
                        <p class="text-gray-600 text-sm mb-4 flex-grow">${site.description}</p>
                        <div class="mt-auto flex items-center text-primary text-sm">
                            <span>访问网站</span>
                            <i class="fa fa-arrow-right ml-2 text-xs"></i>
                        </div>
                    `;
                    sitesGrid.appendChild(card);
                });
                
                // 组合并添加到容器
                categorySection.appendChild(categoryHeader);
                categorySection.appendChild(sitesGrid);
                container.appendChild(categorySection);
            });
        }

        // 搜索功能
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            
            searchInput.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase().trim();
                
                if (!searchTerm) {
                    renderWebsites(websiteData);
                    return;
                }
                
                // 过滤数据
                const filteredData = websiteData.map(category => {
                    const filteredSites = category.sites.filter(site => 
                        site.name.toLowerCase().includes(searchTerm) || 
                        site.description.toLowerCase().includes(searchTerm)
                    );
                    return { ...category, sites: filteredSites };
                }).filter(category => category.sites.length > 0);
                
                renderWebsites(filteredData);
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            renderWebsites(websiteData);
            setupSearch();
        });
    </script>


</body></html>
